<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Gate Opener</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      background: #111;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    button {
      font-size: 1.5rem;
      padding: 1rem 2.5rem;
      border-radius: 999px;
      border: none;
      background: #1db954;
      color: #000;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    button:active {
      transform: translateY(2px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.4);
    }
    #status {
      margin-top: 1rem;
      font-size: 0.9rem;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <button id="openBtn">Open Gate</button>
  <div id="status"></div>

  <script>
    const endpoint = "https://gate-opener.yourname.workers.dev"; // <-- your Worker URL

    document.getElementById("openBtn").addEventListener("click", async () => {
      const statusEl = document.getElementById("status");
      statusEl.textContent = "Sending command...";

      try {
        const res = await fetch(endpoint, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
        });

        if (!res.ok) {
          const text = await res.text();
          statusEl.textContent = "Error: " + text;
          return;
        }

        statusEl.textContent = "Gate command sent.";
      } catch (err) {
        statusEl.textContent = "Network error.";
      }
    });
  </script>
</body>
</html>
